services:
  bot:
    build: .
    container_name: maluna-bot
    restart: unless-stopped

    # Токен и остальные настройки берутся из .env рядом с этим файлом.
    env_file: .env

    # Health-check только с самой машины: 127.0.0.1 не даёт достучаться
    # снаружи. На публичном сервере иначе любой желающий видел бы состав
    # контента и статус базы.
    # Проверять так:  curl localhost:8080/health
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}"

    volumes:
      # База переживает пересборку контейнера.
      - ./data:/app/data
      # Контент можно править на хосте и применять командой /reload без пересборки.
      - ./content:/app/content

    # Логи не должны съесть диск за полгода работы.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
