# ═══════════════════════════════════════════════════════════════════
#  ОТВЕТЫ НА СВОБОДНЫЙ ТЕКСТ
#
#  Бот работает кнопками. Если человек всё-таки написал текстом, бот
#  ищет в сообщении слова из списков ниже — сверху вниз, первое
#  совпадение выигрывает — и отвечает готовой фразой. Никакой генерации.
#
#  Порядок правил важен: тяжёлое эмоциональное сообщение проверяется
#  первым, чтобы человек в трудный момент не получил ответ про доставку.
#
#  Как пополнять: добавь слово в keywords нужного правила. Слова
#  сравниваются без учёта регистра, достаточно куска слова
#  («достав» поймает и «доставка», и «доставку»).
# ═══════════════════════════════════════════════════════════════════

rules:
  # ── 1. Тяжёлое эмоциональное сообщение ────────────────────────────
  # Здесь бот не шутит, не даёт ритуал и не предлагает свечу.
  - id: emotional
    keywords:
      - "не хочу жить"
      - "жить не хочется"
      - "покончить"
      - "суицид"
      - "убить себя"
      - "self harm"
      - "мне очень плохо"
      - "невыносимо"
      - "не могу больше"
      - "depression"
      - "депресси"
      - "паническ"
      - "умер"
      - "умерла"
      - "похорон"
      - "развод"
      - "одиноч"
    answer: |
      Мне жаль, что тебе сейчас тяжело.

      Такое лучше не проживать в одиночку — поговори с близким человеком
      или со специалистом, это правда помогает.

      А я буду рядом, когда захочется тишины 💜

  # ── 2. Вопросы про здоровье ───────────────────────────────────────
  - id: health
    keywords:
      - "болит"
      - "боль"
      - "болезн"
      - "лечит"
      - "лечен"
      - "диагноз"
      - "врач"
      - "таблетк"
      - "лекарств"
      - "аллерг"
      - "беремен"
      - "давлен"
      - "температур"
      - "бессонниц"
      - "мигрен"
    answer: |
      С этим я не помогу — здоровье не моя территория.

      Лучше обратись к врачу, он подскажет точнее 🕯

  # ── 3. Заказы, доставка, цены ─────────────────────────────────────
  - id: order
    keywords:
      - "заказ"
      - "достав"
      - "куп"
      - "цен"
      - "стоит"
      - "стоимост"
      - "скидк"
      - "промокод"
      - "оплат"
      - "трек"
      - "посылк"
      - "возврат"
      - "наличи"
      - "магазин"
    answer: |
      Я не про покупки — здесь только предсказания, ритуалы и справочник ✨

      По заказам и доставке напиши нам: {contacts}

  # ── 4. Вопросы про данные и приватность ───────────────────────────
  - id: privacy
    keywords:
      - "данны"
      - "персональн"
      - "приватн"
      - "конфиденциальн"
      - "храните"
      - "хранишь"
      - "собираешь"
      - "собираете"
      - "удалить меня"
      - "gdpr"
    answer: |
      Честно: я не спрашиваю имя и не сохраняю дату рождения.

      В базе только технический номер твоего аккаунта в Telegram и
      история предсказаний — чтобы одно и то же не приходило дважды.

      Команда /delete стирает всё это 💜

# ── Ответ по умолчанию, если ничего не совпало ──────────────────────
fallback: |
  Я работаю кнопками 🕯

  Выбирай, что тебе сейчас ближе:
