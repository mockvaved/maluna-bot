# ═══════════════════════════════════════════════════════════════════
#  ПРОДУКТЫ MALUNA — раздел «📖 Справочник → Как пользоваться»
#
#  Здесь два образца. Дозаполни файл по ним — весь каталог бренда.
#
#  ── КАК ДОБАВИТЬ ПРОДУКТ ───────────────────────────────────────────
#  1. Скопируй блок целиком, от строки «- id:» до «active: true».
#  2. Вставь в конец файла и поменяй поля под свой продукт.
#  3. Сохрани файл и отправь боту команду /reload.
#
#  Меню категорий бот строит сам: поставил новому продукту category,
#  которой раньше не было, — в справочнике появился новый пункт.
#  Красивое название категории задаётся в texts.yaml → guide.categories
#  (если не задать, в меню покажется само значение category).
#
#  ── ПОЛЯ ───────────────────────────────────────────────────────────
#  id          обязательно, латиницей без пробелов, ни у кого не повторяется
#  name        обязательно, название как на упаковке
#  category    обязательно, например candle / cream / hydrophilic_oil / cleansing_gel
#  short_desc  обязательно, одна строка — что это такое
#  how_to_use  список шагов, каждый с новой строки после дефиса
#  care        как хранить, одна-две строки. Можно не заполнять
#  disposal    как утилизировать. Попадает в ветку «Утилизация»
#  mood_tags   вспомогательные метки, на показ не влияют. Можно оставить []
#  photo       путь к файлу картинки, например media/candle_moon.jpg.
#              Можно не заполнять — тогда карточка будет без фото
#  active      false прячет продукт от пользователей, не удаляя его
# ═══════════════════════════════════════════════════════════════════

- id: candle_basil_green
  name: "Зелёная свеча с базиликом"
  category: candle
  short_desc: "Свеча для денежных практик: новолуние, чек изобилия, чистка канала."
  how_to_use:
    - "Подбирай свечу под намерение: зелёная работает с достатком и ростом."
    - "Зажигай спичками, ставь на подсвечник или фольгу."
    - "Проведи огнём по низу свечи, чтобы она устойчиво стояла."
    - "Три раза проговори намерение вслух и оставшееся время побудь молча."
    - "Дай свече догореть самой — тушить её не нужно."
  care: "Храни в тёмном месте, вдали от батарей и прямого солнца."
  disposal: "Остаток воска без пластиковой основы можно предать земле или сжечь. Подробнее — в разделе «Утилизация»."
  mood_tags: ["намерение", "рост"]
  photo: ""
  active: true

