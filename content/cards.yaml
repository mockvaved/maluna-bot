# ═══════════════════════════════════════════════════════════════════
#  ПРЕДСКАЗАНИЯ — 365 карточек, на год без повторов
#
#  Бот выдаёт одно предсказание в сутки (сброс в 00:00 по Москве) и
#  30 дней не повторяется.
#
#  ── КАК ДОБАВИТЬ ПРЕДСКАЗАНИЕ ──────────────────────────────────────
#  Скопируй любой блок ниже целиком и поменяй три вещи:
#    id     — новый номер, ни у кого больше такого быть не должно
#    title  — заголовок в 2–4 слова
#    text   — одна-две светлые строки
#  Сохрани файл и отправь боту команду /reload.
#
#  ── ФОРМУЛА ────────────────────────────────────────────────────────
#  Первая фраза — само предсказание: что произойдёт сегодня.
#  Вторая — короткая подсказка, как этим воспользоваться.
#  Это не совет и не лайфхак: карточка сначала обещает, потом
#  подсказывает. «Сегодня придёт весть, которой ты ждёшь. Держи
#  телефон под рукой» — да. «Смени постель» — нет.
#
#  ── ПРАВИЛА ────────────────────────────────────────────────────────
#  • Всегда светло: предсказание — подарок, а не утешение.
#  • Обращение на «ты», без имени. Максимум 1–2 эмодзи: 🕯 ✨ 💜
#  • Гендерная нейтральность: никаких «сделала», «устал», «готова»,
#    «сама», «рада», «одному», «виноват». Опора на настоящее и
#    будущее время и на повелительное наклонение.
#  • Запретные темы: здоровье, политика, деньги, отношения, внешность
#    и вес, утраты, работа и увольнения.
#
#  Всё это проверяется автоматически:
#      pytest tests/test_cards_quality.py
#  Тест падает и показывает, в какой карточке что не так.
#
#  active: false прячет карточку из выдачи, не удаляя её.
# ═══════════════════════════════════════════════════════════════════

