# ═══════════════════════════════════════════════════════════════════
#  ПРЕДСКАЗАНИЯ
#
#  Бот выдаёт одно предсказание в сутки (сброс в 00:00 по Москве) и
#  старается 30 дней не повторяться. Чем больше карточек в файле, тем
#  дольше человеку не приходит одно и то же.
#  Здесь лежат образцы — дозаполни файл по ним.
#
#  ── КАК ДОБАВИТЬ ПРЕДСКАЗАНИЕ ──────────────────────────────────────
#  Скопируй любой блок ниже целиком и поменяй три вещи:
#    id     — новый номер, ни у кого больше такого быть не должно
#    title  — заголовок в 2–4 слова
#    text   — одна-две светлые строки
#  Сохрани файл и отправь боту команду /reload.
#
#  ── ТОН ────────────────────────────────────────────────────────────
#  Всегда светло: предсказание должно быть подарком, а не утешением.
#  Обращение на «ты», без имени. Максимум 1–2 эмодзи: 🕯 ✨ 💜
#
#  Хорошо: «Вселенная приготовила тебе удивительный день ✨»
#  Плохо:  «Сегодня спокойный день. Не торопись» — звучит как утешение.
#
#  active: false прячет карточку из выдачи, не удаляя её.
# ═══════════════════════════════════════════════════════════════════

