# ═══════════════════════════════════════════════════════════════════
#  ВСЕ ТЕКСТЫ ИНТЕРФЕЙСА MALUNA-БОТА
#
#  Здесь можно менять любую фразу и подпись кнопки — код трогать не нужно.
#  После правки: сохрани файл и отправь боту команду /reload
#
#  Правила:
#   • отступы делаются пробелами, не табами;
#   • многострочный текст пишется после символа | с отступом (см. welcome);
#   • {скобки} — это подстановки, их нельзя переименовывать и удалять.
# ═══════════════════════════════════════════════════════════════════

# ── Приветствие по /start ───────────────────────────────────────────
welcome: |
  MALUNA — это про свет, тепло и паузу среди дня 🕯

  Здесь ты можешь получить предсказание, собрать свой ритуал,
  открыть астропрогноз на 2027 год и заглянуть в справочник.

  Бот ничего не продаёт и не собирает данные о тебе.

  Выбирай, с чего начать ✨

# ── Главное меню ────────────────────────────────────────────────────
menu:
  title: "Выбирай, что тебе сейчас ближе ✨"
  buttons:
    prediction: "🕯 Предсказание"
    ritual: "✨ Собери свой ритуал"
    astro: "🔮 Астропрогноз 2027"
    guide: "📖 Справочник"
    about: "💜 О бренде"

# ── Общие кнопки, которые встречаются на многих экранах ─────────────
common:
  to_menu: "В меню"
  back_to_menu: "Вернуться в меню"
  back: "Назад"
  cancel: "Отмена"
  error: "Что-то пошло не так. Попробуй ещё раз чуть позже 🕯"

# ── Предсказание ────────────────────────────────────────────────────
prediction:
  # {title} и {text} подставляются из cards.yaml
  card: |
    {title}

    {text}
  # Приписка, если предсказание на сегодня уже было получено
  already_today: "Следующее предсказание будет завтра ✨"

# ── Собери свой ритуал ──────────────────────────────────────────────
ritual:
  intro: |
    Пять коротких вопросов — и я подберу ритуал под твоё состояние ✨

    Ответы никуда не сохраняются.
  # {current} — номер текущего шага, {total} — всего шагов
  progress: "Шаг {current} из {total}"
  multi_hint: "Отметь всё, что есть под рукой, и нажми «Готово»"
  multi_done: "Готово"
  multi_empty: "Отметь хотя бы один пункт — так ритуал получится точнее 🕯"
  another: "Другой вариант"
  no_more: "Это всё, что подходит под твои ответы. Попробуй собрать ритуал заново ✨"
  cancelled: "Хорошо, вернёмся к этому позже 💜"
  # Карточка ритуала: {title} — название, {text} — текст ритуала
  result: |
    {title}

    {text}
  products_header: "В ритуале участвуют:"
  questions:
    - key: time_of_day
      text: "Какое сейчас время?"
      options: ["утро", "день", "вечер"]
    - key: duration
      text: "Сколько у тебя есть времени?"
      options: ["5 минут", "15 минут", "30 минут"]
    - key: mood
      text: "Какое у тебя настроение?"
      options: ["устала", "тревожно", "хочется вдохновения", "радостно"]
    - key: desire
      text: "Что хочется сейчас?"
      options: ["отдохнуть", "взбодриться", "позаботиться о коже", "создать уют"]
    - key: items
      text: "Что есть дома?"
      multi: true
      options:
        - "свечи MALUNA"
        - "гидрофильное масло MALUNA"
        - "очищающий гель MALUNA"
        - "увлажняющий крем MALUNA"
        - "душ"
        - "ванна"
        - "кофе"
        - "чай"

# ── Астропрогноз 2027 ───────────────────────────────────────────────
astro:
  subscribe_required: |
    Астропрогноз на 2027 год мы открываем подписчикам канала MALUNA ✨

    Подпишись — и возвращайся, раздел откроется сразу.
  subscribe_button: "Подписаться"
  check_button: "Я подписался"
  not_subscribed_yet: "Пока не вижу подписки. Загляни в канал и нажми «Я подписался» ещё раз 🕯"
  ask_date: |
    Напиши свою дату рождения.

    Достаточно дня и месяца, например: 14.03
  privacy_note: "Дату мы не сохраняем — она нужна только чтобы определить знак 💜"
  invalid_date: "Не получилось прочитать дату. Напиши в формате ДД.ММ, например: 14.03"
  too_many_attempts: "Давай вернёмся к этому чуть позже — просто зайди в раздел ещё раз 🕯"
  # {title} — заголовок из astro_2027.yaml, {text} — текст прогноза
  forecast: |
    {title}

    {text}
  product_header: "В тему года:"
  another_date: "Другая дата"

# ── Справочник ──────────────────────────────────────────────────────
guide:
  title: "Что тебе показать? 📖"
  how_to_use: "Как пользоваться"
  how_to_use_title: "Выбери, о чём рассказать 🕯"
  practices: "Ритуалы со свечами"
  practices_title: "Практики со свечами MALUNA ✨"
  disposal: "Утилизация"
  disposal_title: "Что делать с остатками 💜"
  empty_section: "Этот раздел мы пока наполняем. Загляни чуть позже ✨"
  # Карточка продукта
  product_card: |
    {name}

    {short_desc}
  product_how_to_use: "Как пользоваться:"
  product_care: "Хранение:"
  product_disposal: "Утилизация:"
  # Названия категорий продуктов для меню.
  # Слева — значение поля category в products.yaml, справа — подпись кнопки.
  # Если категории тут нет, в меню покажется само значение category.
  categories:
    candle: "Свечи"
    cream: "Кремы"
    hydrophilic_oil: "Гидрофильное масло"
    cleansing_gel: "Очищающий гель"

# ── О бренде ────────────────────────────────────────────────────────
about: |
  MALUNA 💜

  Мы делаем свечи и уход, которые помогают отвлечься от суеты
  и побыть немного наедине с собой.

  Этот бот ничего не продаёт и не собирает данные о тебе:
  ни имени, ни даты рождения, ни переписки.

  Команда /delete в любой момент сотрёт всё, что связано с тобой.

about_site_button: "Сайт бренда"
# Ссылка на сайт. Единственная ссылка на бренд во всём боте.
about_site_url: "https://maluna.ru"          # [ЗАПОЛНИ: адрес сайта MALUNA]
about_contacts: "@maluna_support"            # [ЗАПОЛНИ: контакт для вопросов о заказах]

# ── Удаление данных ─────────────────────────────────────────────────
delete:
  confirm: |
    Сотру всё, что связано с тобой: историю предсказаний и обезличенную статистику.

    Действие необратимое — вернуть данные не получится.
  confirm_button: "Да, удалить"
  cancel_button: "Не надо"
  done: "Готово. Всё стёрто 💜"
  cancelled: "Оставляю всё как есть ✨"

# ── Служебные сообщения для админов ─────────────────────────────────
admin:
  reload_ok: "Контент перечитан ✅"
  # {error} — текст ошибки валидации
  reload_failed: |
    Не получилось перечитать контент, работает прежняя версия.

    {error}
