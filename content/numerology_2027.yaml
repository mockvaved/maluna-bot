# ═══════════════════════════════════════════════════════════════════
#  ЛИЧНЫЙ ГОД 2027 — раздел «🎁 Подарок за отзыв»
#
#  Человек присылает фото отзыва и дату рождения, бот считает цифру
#  и показывает один из девяти разборов.
#
#  ── КАК СЧИТАЕТСЯ ЦИФРА ────────────────────────────────────────────
#  Складываются все цифры дня, месяца и 2027, пока не останется одна:
#     15 июня → 1+5+0+6+2+0+2+7 = 23 → 2+3 = 5
#     28 ноября → 2+8+1+1+2+0+2+7 = 23 → 5
#  Считает бот сам, в файле ничего менять для этого не нужно.
#
#  ── КАК ПРАВИТЬ ────────────────────────────────────────────────────
#  Меняй только title и text. Поле number трогать нельзя — по нему
#  бот находит нужный разбор. Записей должно быть ровно девять,
#  с номерами от 1 до 9.
#
#  product_ids — необязательное: id товаров из products.yaml, которые
#  бот покажет под прогнозом. Пусто — кнопки товара не будет.
# ═══════════════════════════════════════════════════════════════════

- number: 1
  title: "1 — год старта"
  text: |
    Девятилетний цикл начинается заново. Вы выходите из 2026 года, где что-то закончилось: работа, отношения, город, привычный уклад. В 2027 на освободившееся место приходит новое, и приходит оно не само. Кто-то должен сделать первый шаг, и этот кто-то вы.

    РАБОТА И ДЕНЬГИ
    Год для запуска, а не для сбора урожая. Смена работы, своё дело, новая специальность, первый клиент. Денег в начале может стать меньше, потому что вы вкладываете. Июль складывается в восьмёрку, и это ваш финансовый месяц: подписания, переговоры о ставке, крупные сделки лучше двигать туда. Сентябрь снова даёт единицу, второй разгон для того, что вы не успели запустить весной.

    ОТНОШЕНИЯ
    Знакомства идут легко, а вот терпения к близким мало. Единица делает вас самодостаточным до резкости. Партнёр может услышать «я справлюсь сам» как «ты мне не нужен». Проговаривайте вслух то, что для вас очевидно.

    ЗДОРОВЬЕ
    Голова, давление, глаза. Единица гонит энергию вверх, отсюда бессонница и раздражение.

    ОСТОРОЖНО
    Фон года двоечный, и он тормозит вас там, где вы привыкли брать напором. Согласования затянутся, ответы будут приходить дольше, чем вы рассчитали. Заложите к своим срокам полтора месяца сверху и не считайте задержку провалом.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Начать то, что вы откладывали с 2024 года. Отложите ещё раз, и следующее удобное окно откроется только в 2036.
  product_ids: []

- number: 2
  title: "2 — год союзов"
  text: |
    Ваша цифра совпала с цифрой года, и это усиливает всё двоечное вдвое. Год, когда вы почти ничего не делаете в одиночку. Результат приходит через людей: партнёра, начальника, соавтора, того, кто вас порекомендовал.

    РАБОТА И ДЕНЬГИ
    Инициатива со стороны, а не от вас. Вас позовут, предложат, посоветуют. Ваша задача не пропустить и вовремя ответить «да». Июнь складывается в восьмёрку и приносит основные деньги года. Август даёт единицу, там появляется шанс начать что-то своё, и он один за весь год, не проспите его.

    ОТНОШЕНИЯ
    Год свадеб, съездов, примирений и совместных проектов. Одинокие часто встречают человека через общих знакомых, а не в интернете. Пары или укрепляются, или расходятся, потому что двойка не терпит подвешенного состояния и вытаскивает наружу всё, о чём вы молчали.

    ЗДОРОВЬЕ
    Нервы, желудок, гормональный фон. Всё, что вы проглотили и не сказали, вернётся телом.

    ОСТОРОЖНО
    Чувствительность зашкаливает. Вы услышите обиду там, где её не было, и запомните фразу, которую человек уже забыл. Прежде чем обидеться, переспросите, что он имел в виду.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Довести до конца один разговор, который вы обходите стороной уже несколько лет.
  product_ids: []

- number: 3
  title: "3 — год голоса"
  text: |
    Тройка вытаскивает вас на люди. Год, когда вас начинают слышать: соцсети, выступления, тексты, преподавание, любая форма, где вы говорите от своего имени. Настроение выше обычного, знакомств много, приглашений тоже.

    РАБОТА И ДЕНЬГИ
    Деньги приходят через видимость. Вас нашли, потому что где-то заметили. Май складывается в восьмёрку и даёт финансовый пик. Июль даёт единицу, хорошее окно для запуска канала, курса, портфолио. Сентябрь тройка в тройке, самый громкий месяц года: там имеет смысл ставить публикацию, презентацию или выход в эфир.

    ОТНОШЕНИЯ
    Флирт, лёгкость, много общения. Романы вспыхивают быстро. Тройка не любит обязательств, поэтому серьёзные решения в отношениях лучше не принимать в разгар веселья, дайте им дожить хотя бы до осени.

    ЗДОРОВЬЕ
    Горло, зубы, кожа. Тройка садит голос буквально у тех, кто много говорит.

    ОСТОРОЖНО
    Распыление. Вы возьмёте пять проектов, доведёте полтора и в декабре будете считать год пустым. Выберите два направления в январе и держитесь их.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Показать миру то, что вы делали в стол.
  product_ids: []

- number: 4
  title: "4 — год фундамента"
  text: |
    Самый трудовой год цикла. Романтики мало, зато то, что вы построите, простоит долго. Четвёрка любит порядок: документы, регламенты, ремонт, накопления, диплом, режим дня.

    РАБОТА И ДЕНЬГИ
    Рост через объём работы, а не через удачу. Повышение приходит после того, как вы вытянули на себе сложный участок. Апрель складывается в восьмёрку, туда стоит ставить разговор о деньгах и крупные покупки. Сентябрь даёт четвёрку в четвёрке, самый тяжёлый и самый результативный месяц: скучный, вязкий, но именно в нём вы закроете то, что тянули с весны.

    ОТНОШЕНИЯ
    Быта больше, чем чувств. Ипотека, ремонт, переезд, распределение обязанностей. Партнёру может показаться, что вы превратились в сожителя. Раз в неделю выходите вдвоём куда угодно, где нет разговоров о деньгах.

    ЗДОРОВЬЕ
    Спина, колени, суставы, зубы. Четвёрка бьёт по опоре тела. Диспансеризация в этом году не формальность, а вложение.

    ОСТОРОЖНО
    Год плохо переносит авантюры. Быстрые заработки, займы под проценты и переход в незнакомую сферу с нуля в 2027 году для вас заканчиваются потерей. Стройте на том, что уже есть.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Закрыть долги и навести порядок в бумагах. Звучит скучно, освобождает сильно.
  product_ids: []

- number: 5
  title: "5 — год перемен"
  text: |
    Пятёрка ломает расписание. Год, в котором план, написанный в январе, к июню становится смешным. Поездки, переезды, новые люди, неожиданные предложения, внезапные отмены.

    РАБОТА И ДЕНЬГИ
    Смена места, формата, страны. Часто предложение приходит оттуда, откуда вы не ждали, и решать надо за неделю. Март и декабрь складываются в восьмёрку, это две финансовые точки года. Май даёт единицу, окно для старта. Сентябрь пятёрка в пятёрке, самый турбулентный месяц: там лучше ничего не подписывать, а просто пережить.

    ОТНОШЕНИЯ
    Свобода важнее стабильности. Пятёрка расшатывает любые рамки, поэтому пары или учатся давать друг другу воздух, или расходятся. Романы в поездках, знакомства на бегу, страстно и недолго.

    ЗДОРОВЬЕ
    Нервная система, сон, спина от дороги. Алкоголь и всё, что снимает напряжение быстро, в пятёрочный год цепляет сильнее обычного. Держите это в голове.

    ОСТОРОЖНО
    Азарт. Ставки, крипта, «войти сейчас, пока не поздно», спонтанный кредит на мечту. Правило на весь год: между желанием и оплатой три дня паузы.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Сказать «да» тому предложению, которое напугает вас размером.
  product_ids: []

- number: 6
  title: "6 — год дома"
  text: |
    Шестёрка разворачивает вас к близким. Год про семью, ответственность и заботу, часто не по вашему выбору, а потому что кому-то из родных вы понадобились.

    РАБОТА И ДЕНЬГИ
    Стабильно, без рывков. Деньги приходят через людей, которым вы помогаете: клиенты, ученики, пациенты, свои же родственники. Февраль и ноябрь складываются в восьмёрку, это финансовые окна. Сентябрь шестёрка в шестёрке, месяц семейных решений: свадьбы, переезды, разговоры о наследстве и общем бюджете.

    ОТНОШЕНИЯ
    Один из самых сильных годов цикла для брака и детей. Предложения, беременности, воссоединения, знакомство с родителями. Одинокие часто встречают партнёра через семейный круг или соседей.

    ЗДОРОВЬЕ
    Сердце, грудь, щитовидка, поясница. Шестёрка накапливает усталость от заботы, а вы замечаете её последней.

    ОСТОРОЖНО
    Вы возьмёте на себя больше, чем можете унести, и назовёте это любовью. Через полгода придёт раздражение на тех же людей. Разрешите себе говорить «нет» родне, это не предательство.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Разобраться с жильём: купить, отремонтировать, разъехаться или наконец обустроить то, что есть.
  product_ids: []

- number: 7
  title: "7 — год глубины"
  text: |
    Семёрка убирает шум. Внешне год выглядит пустым: меньше событий, меньше людей, меньше движения. Внутри в это время происходит основное.

    РАБОТА И ДЕНЬГИ
    Не год карьерных прыжков. Год учёбы, исследования, повышения квалификации, работы над качеством. Январь и октябрь складываются в восьмёрку, там сосредоточены деньги и деловые разговоры. Сентябрь семёрка в семёрке, самый уединённый месяц: отпуск в одиночестве или хотя бы неделя без переписок принесёт вам больше, чем любые усилия. Декабрь даёт единицу, вы начинаете разворачиваться наружу.

    ОТНОШЕНИЯ
    Вам нужно больше пространства, чем партнёр готов дать. Объясните это заранее, иначе он прочитает вашу тишину как охлаждение. Поверхностные связи в этом году отваливаются сами, и вы об этом не пожалеете.

    ЗДОРОВЬЕ
    Психика, сон, иммунитет. Семёрка обостряет всё, что вы годами задвигали. Психотерапия в этот год работает заметно лучше.

    ОСТОРОЖНО
    Изоляция и уход в фантазии. Разница между уединением и одиночеством в том, что из уединения вы возвращаетесь. Держите двух-трёх человек, с которыми видитесь вживую.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Выучить то, что давно хотели, и разобраться, зачем вы делаете то, что делаете.
  product_ids: []

- number: 8
  title: "8 — год результата"
  text: |
    Восьмёрка собирает урожай. Всё, что вы вкладывали с года-единицы, в 2027 показывает свою цену. Год денег, статуса и власти, а заодно проверки на честность: восьмёрка возвращает и вложения, и долги.

    РАБОТА И ДЕНЬГИ
    Крупные суммы, руководящие роли, сделки, суды, наследство, продажа бизнеса. Сентябрь восьмёрка в восьмёрке, финансовый пик всего девятилетия, туда стоит ставить главные переговоры. Февраль даёт единицу для старта нового направления. Август складывается в семёрку, странная пауза посреди активного года: не паникуйте, используйте её на анализ и подготовку к сентябрю.

    ОТНОШЕНИЯ
    Возможен перекос: вы вкладываетесь в работу, партнёр остаётся с остатками вашего внимания. Восьмёрка обостряет тему денег в паре, кто зарабатывает и кто решает. Обсудите это прямо, до того как обида окрепнет.

    ЗДОРОВЬЕ
    Давление, сосуды, спина, выгорание. Год, где легко доработаться до больницы и назвать это преданностью делу.

    ОСТОРОЖНО
    Жёсткость. Восьмёрка даёт силу, а фон 2027 наказывает за давление на людей. Побеждайте расчётом, а не нажимом, иначе выигранная сделка обойдётся вам в отношения с командой.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Просить больше. Ставка, доля, цена вашей работы, всё это в 2027 году пересматривается в вашу пользу, если вы откроете рот.
  product_ids: []

- number: 9
  title: "9 — год завершений"
  text: |
    Девятка закрывает цикл, который начался в 2019 году. Год расчистки: уходит работа, отношения, город, привычки, иногда люди. Отпускать больно, но место освобождается под 2028, где начнётся новая единица.

    РАБОТА И ДЕНЬГИ
    Проекты доводятся до конца, а не начинаются. Увольнение по собственному желанию в девятку случается часто, и это редко ошибка. Август складывается в восьмёрку, там закрываются финансовые вопросы: расчёты, продажи, возврат долгов. Сентябрь девятка в девятке, самый эмоциональный месяц года. Октябрь даёт единицу, и вы впервые чувствуете новый воздух.

    ОТНОШЕНИЯ
    Расставания, которые назревали годами, происходят именно сейчас. Возвращаются старые знакомые, часто чтобы попрощаться по-человечески. Новые отношения, начатые в девятку, редко доживают до 2029, имейте это в виду.

    ЗДОРОВЬЕ
    Иммунитет, хроника, всё старое обостряется, чтобы вы наконец им занялись. Организм просит сна и меньше нагрузки.

    ОСТОРОЖНО
    Не цепляйтесь. Главная ошибка девятки в том, что человек удерживает работу или отношения, которые уже закончились, и весь год живёт в подвешенном состоянии. Отпущенное в 2027 году возвращается новым в 2028.

    ГЛАВНОЕ ДЕЙСТВИЕ ГОДА
    Разобрать всё лишнее: шкаф, контакты, обязательства, чувство вины. Освободить руки.
  product_ids: []
