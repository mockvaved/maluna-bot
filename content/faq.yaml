# ── Как пользоваться ────────────────────────────────────────────────

- id: faq_candles_general
  section: "Как пользоваться"
  question: "Как работать со свечами"
  order: 10
  active: true
  answer: |
    Перед тем, как работать со свечами, важно понять:

    Свечи — твой инструмент и помощник на пути к желаемому, но ключ к успеху кроется внутри тебя.
    Свечи можно использовать как поштучно, так и скручивая несколько свечей в одну.

    В каждом наборе MALUNA свечи подобраны с определенным смыслом и значением, поэтому подбирай свечи в соответствии со своим намерением.
    Зажигай свечи по внутреннему отклику, но если хочешь усилить их действие, то следуй нашим рекомендациям.

    1. Для начала очисти пространство вокруг себя.

    2. Подбери время таким образом, чтобы никто не мог потревожить тебя во время практик.

    3. Ты можешь зажечь свечу просто в подсвечнике, а можешь использовать фольгу.

    4. Практика началась: подожги свечу желательно с помощью спичек, поставь на подсвечник или фольгу. Чтобы свеча устойчиво стояла, проведи огнём по низу свечи.

    5. Концентрируемся на своём намерении. Есть 2 направления желаний: притягивание в жизнь чего-либо или избавление от чего-либо.

    6. Вслух 3 раза проговариваем: «Пламенем от этой свечи я избавляю себя от **** / я притягиваю к себе ****. Да будет так».

    7. Оставшееся время горения свечи проводим молча, в своих мыслях. Концентрируйся на пламени, думай о загаданном.

    8. Очень важно, чтобы свеча догорела сама. Не нужно её тушить. Когда свеча догорит, ритуал будет окончен.

    Остатки утилизируй согласно инструкции по утилизации.

    Для привлечения чего-то в жизнь лучше зажигать свечу на растущую луну, для очищения — на убывающую. Это не обязательно, но усиливает действие свечи.

- id: faq_candles_burning
  section: "Как пользоваться"
  question: "Свеча горит не так, как я ожидала"
  order: 20
  active: true
  answer: |
    Время и характер горения свечи очень индивидуальны.

    Свеча может сгореть за 5 минут, а может за 40. Пламя может скакать, а может быть ровным.

    Не пугайся — это нормально 🕯

# ── Утилизация ──────────────────────────────────────────────────────

- id: faq_disposal_earth
  section: "Утилизация"
  question: "Земля"
  order: 10
  active: true
  answer: |
    Если остатки легко разлагаются, мы «захораниваем» их в земле. Идеальный вариант — если у вас рядом есть лес, огород и т.д.

    Многие живут в квартирах и не имеют доступа к почве, поэтому мы можем от остатков избавиться в горшке с землей. Земля перерабатывает и материю, и энергию, поэтому такой способ утилизации — лучший для всего, что несет в себе неустойчивую или негативную энергию.

- id: faq_disposal_air
  section: "Утилизация"
  question: "Воздух"
  order: 20
  active: true
  answer: |
    Такая утилизация вкладывает в ритуал особый магический смысл. Она символизирует новые начинания, мудрость, свежие идеи, открытия.

    Распыляя таким образом остатки (например, пепел), визуализируйте, как раздуваете их по четырем концам света.

- id: faq_disposal_water
  section: "Утилизация"
  question: "Вода"
  order: 30
  active: true
  answer: |
    Проточная вода, которая идет потоком, — отличный способ избавления от всего лишнего.

    Вода все поглощает, впитывает и трансформирует. Такой способ отлично подходит при проведении ритуалов на исцеление и внутренние изменения.

- id: faq_disposal_fire
  section: "Утилизация"
  question: "Огонь"
  order: 40
  active: true
  answer: |
    Сжигайте остатки, которые не имеют пластиковой основы.

    Огонь идеально подходит практически при всех ритуалах, кроме ритуалов от одержимости, снятия проклятий и сглазов. Дым от оставшихся объектов задерживается в помещении, и энергия может оставаться с вами, а ритуал не будет иметь силы.

- id: faq_disposal_glass
  section: "Утилизация"
  question: "Свечи и стекло"
  order: 50
  active: true
  answer: |
    Залей остатки воска горячей водой и дай постоять несколько минут — воск сам поднимется наверх.

    Вынь фитильный держатель, вымой стакан с мылом и используй под кисти, спички или мелочи.

    Стекло сдай в переработку, если решишь с ним расстаться 🕯

- id: faq_disposal_packaging
  section: "Утилизация"
  question: "Упаковка косметики"
  order: 60
  active: true
  answer: |
    Разбери упаковку по материалам: картон отдельно, пластик отдельно, стекло отдельно.

    Флаконы ополосни водой — чистая тара принимается в переработку, грязная нет.

    Картонные коробки складывай плоско, так они занимают меньше места в контейнере 💜
