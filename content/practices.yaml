- id: practice_money_wellbeing
  title: "Практика финансового благополучия"
  order: 60
  active: true
  text: |
    Приготовьте 1 зеленую свечу с базиликом, 2 желтые свечи с календулой, фольгу, спички, а также чистый лист бумаги и красную ручку / карандаш.

    Мы с вами сделали все необходимые чистки, активировали новые возможности, ваш потенциал. Сейчас время — привлекать желаемое в свою жизнь.

    Давайте будем честны, все мы любим деньги. И это, пожалуй, одно из самых честных и искренних чувств, которое может быть.
    Нам часто говорят не быть меркантильными, довольствоваться малым, что деньги — просто бумажка и т.д.

    НЕ ПРИНИМАЙТЕ такие размышления в свою жизнь. Деньги делают нашу жизнь проще, более полной и насыщенной, дарят чувство безопасности.
    Поэтому давайте преумножать их с помощью ритуала, не забывая, что мешок денег не свалится к нам на голову просто так, что нужно также предпринять физические усилия для того, чтобы кошелек был всегда полон.

    Итак, для начала делаем скрутку из 3-х свечей.
    Для начала свечи погрейте в своих ладонях, приговаривая:

    «Деньги в лёгкости, деньги в радости
    Монетка к монетке, купюра к купюре,
    Я получаю, я трачу, я преумножаю.
    Да будет так»

    И скручивайте 3 свечи в одну. Далее зажигайте спичками на фольге и проведите практику.

    ЧЕК ИЗОБИЛИЯ

    Заполняется от руки на чистом листе. Перед заполнением можно сделать дыхательную практику на восстановление внутреннего баланса. После заполнения чек оставьте на ночь на подоконнике, а затем уберите в укромное место.

    Заголовок: «Банк Вселенной. Чек изобилия»
    Кому: ваше ФИО
    Сумма: желаемая сумма, которую вы хотите получить в ближайший лунный месяц чуть выше нормы (если ваш доход в месяц 10.000, писать миллион — нецелесообразно)
    Назначение: прописываем, на что конкретно нужна эта сумма
    Получатель: ставим свою подпись

    ОСТАВЛЯЕМ письмо текстом вниз на подоконнике, куда попадает лунный свет. На следующее утро кладите к себе в кошелек / под чехол телефона.

- id: practice_money_channel
  title: "Чистка денежного канала"
  order: 70
  active: true
  text: |
    Что нам понадобится для ритуала:

    — Ваше фото, где вы одни без других людей.
    — Отливальная чаша. Если вы не проводите отливки и чистки регулярно, а, например, будете делать чистку впервые, возьмите миску среднего размера. Не используйте ее для других целей, кроме как эзотерических.
    — Зеленая свеча-скрутка.
    — Вода.

    Порядок действий:

    Подготавливаем стол: убираем все лишнее, протираем. В отливальную чашу / миску наливаем прохладную воду. Миску с водой ставим на фотографию. Дальше берем хорошую щепотку соли и размешиваем своей рукой в миске с водой по часовой стрелке. Дальше зажигаем скрутку из 3-х свечей и держим ее под наклоном и так, чтобы воск капал в чашу с водой.

    Пока воск от горящей скрутки капает, проговариваем ритуал 3 раза:

    «Пламенем горящих свечей снимаю негативные воздействия,
    Все их причины и последствия,
    Все невзгоды, закрытые дороги, безденежье, смуту каплями воска запечатываю.
    Огнем избавляю от негатива, злых помыслов и побуждений,
    Всего, что закрывало пути к богатству, счастью, достатку.
    Силой огня и воды от дурного очищаю,
    Все приговоренное в воске запираю.
    Да будет так.»

    Далее если свеча не догорела, кидаем ее в воду. Больше свечи и остатков воска мы касаться НЕ должны. Все, что осталось от ритуала, выливаем и выбрасываем подальше от себя. Свечи утилизировать, предавая земле, не надо, достаточно будет просто их выбросить.
    Фото оставляем как есть, его утилизировать не надо.
