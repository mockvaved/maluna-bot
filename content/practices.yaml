- id: practice_full_moon
  title: "Практика сокровенного желания"
  order: 10
  active: true
  text: |
    Полнолуние — день максимального аккумулирования энергии. Как раз этот день подходит не только для ежедневных поддерживающих практик, но и для реализации чего-то особенного.

    Выберете себе большое намерение, цель, возможно длительностью в несколько месяцев, и используйте полнолуние, чтобы работать с этой практикой.

    Итак, что мы делаем:

    1. В этот день проявляем щедрость.
    Подключаем к проработке намерения не только свечи, но и другие инструменты. Можем завязывать нить желаний, активировать кристаллы, до практики проработать дом через палочки пало санто. Определенной формулы нет, но призываем выложиться на максимум.

    2. Проводим большую практику вечером, желательно перед сном. Так мы запустим намерение из профицита энергии, и завершим программу своим сном.

    3. Проводим практику желания в чистоте. То есть мы должны быть после душа и всех очищающих ритуалов, пространство вокруг нас тоже. Если использовать будем кристаллы, то их тоже надо очистить.

    4. Подбираем свечи в соответствии с намерением, здесь у вас сложности, думаю, не будет. Как раз можно зажигать несколько свечей одновременно или сделать скрутку.

    5. Можно дополнительно написать свое намерение, на него поставить подсвечник / фольгу, дать свече прогореть. И под конец, когда уже видно, что свеча догорает последние минуты, записку сжечь пламенем от свечи, пеплу дать прогореть в подсвечнике, а когда свеча потухнет, поблагодарить за практику.

- id: practice_new_moon_money
  title: "Денежная практика новолуния"
  order: 20
  active: true
  text: |
    Новолуние — лучшее время для чистки и запуска работы денежного канала. Мы можем раскрыть свой финансовый потенциал, укрепить денежное положение.

    ЧТО НАМ ПОНАДОБИТСЯ

    — 3 зеленые свечи с базиликом НЕ скрученные.
    — Монетки, желательно мелкие, но если нет, то можно любые.
    — Плоский небольшой подсвечник (как у нас) или жаропрочная тарелочка.
    — Лист бумаги (маленький кусочек) и ручка.
    — Если есть ритуальная скатерть или большая тканевая салфетка (белая или фиолетовая), тоже используем для сакральности процесса. Если нет, то просто подготовьте пространство, так как в захламленной зоне практику проводить нельзя.

    ПОДГОТАВЛИВАЕМСЯ

    Найдите тихое, уединенное место, где вас никто не будет отвлекать.
    Разложите ткань на столе или на земле (если вы в частном доме), положите на нее подсвечник, создавая таким образом священное пространство для практики.
    Убедитесь, что у вас есть все необходимые материалы под рукой.

    НАША ПРАКТИКА ПО ЭТАПАМ

    1. Зажгите зелёные свечи и поставьте их на подсвечник. Пока они горят, сделайте несколько глубоких вдохов и выдохов, визуализируя, как с каждым выдохом укрепляется ваше финансовое намерение, как вы готовы к изменениям, благополучию.

    2. Возьмите лист бумаги и ручку. Запишите на бумаге свою главную финансовую цель. Будьте конкретными, намерение формируется в позитивном ключе, пишем в настоящем времени. Намерение выбираем РЕАЛИЗУЕМОЕ, к которому вы сможете прийти. Лист положите под подсвечник с уже горящими свечами.

    Про позитивный ключ мышления, приведем пример:
    ✗ Привлечение денег для закрытия кредитов
    ✓ Привлечение денег для укрепления финансового положения и обретения свободы

    3. Возьмите монетки и положите ПО ОЧЕРЕДИ их на тарелку или подсвечник, прям к свечам. Визуализируйте, как каждая монета символизирует приток денег в вашу жизнь. Проговаривайте вслух свои установки, например: «Я привлекаю богатство и изобилие», «Деньги приходят ко мне легко и свободно».

    4. Закройте глаза и сосредоточьтесь на своем намерении. Представьте, как все ваши финансовые желания сбываются. Почувствуйте, как энергия богатства заполняет вашу жизнь. Держите это состояние как можно дольше.

    5. Когда вы будете готовы, поблагодарите вселенную за поддержку. Достаньте листик и сожгите его в пламени свечи, сохраняя при этом намерение о том, что ваше желание уже исполнилось. Дайте свечам окончательно догореть. Монетки оставьте на тарелке, как символ притока финансов.

    6. В течение ближайшего будущего старайтесь быть открытыми к возможностям, которые могут привести к укреплению вашего финансового состояния. Действуйте в соответствии со своим намерением, и не забывайте о благодарности за всё, что у вас уже есть.

    Остатки от этой практики не расшифровываем! У нас свеча идет в более глубокой практике. Монетки не трогаем, не перебираем, не ковыряем, не забираем, чтобы потратить!
    Сохраняем блюдце с монетками МИНИМУМ до следующего новолуния.
    Если будет потребность укрепить намерение через повторную практику, можно использовать эти же монетки, предварительно убрав огарок, помыв подсвечник и монетки прополоскать в солевом растворе. Через месяц у вас может быть другая энергия, другой окрас желаемого, поэтому важно солью промыть.

- id: practice_ancestors
  title: "Практика на укрепление связи с родом"
  order: 30
  active: true
  text: |
    Мы проводим эту практику, когда особо остро чувствуем необходимость поддержки рода, укрепления связи, получение одобрения или совета.

    Мы — часть нашей родовой системы, за нашими спинами стоит огромное количество предков, поэтому связь с ними играет нам только в плюс.

    Что нам нужно для практики:
    — Коричневые свечи с березой.
    — Травы-усилители, выберите те, которые вам близки. Например, мелисса, лаванда, сухая петрушка. Эти травы энергетически уравновесят наше пространство.

    Итак, практика:

    Для начала найдите тихое и уютное место, где вас никто не побеспокоит. Уберите все лишние предметы, чтобы создать чистое пространство для практики, и разложите между собой свечи и травы.

    В первую очередь мы окуриваем пространство. Подожгите на пару секунд свои травы, потушите и дымом пройдитесь по помещению, в котором проводите практику. Комнаты будет достаточно.

    Если у вас пучок, обходим комнату с пучком в руках. Если травы мелкие, нужна специальная жаропрочная емкость для обхода.

    Подготовьте свечи. Используем в практике 1–3 свечи за раз.

    Зажигаем свечи друг за другом, скрутку не делаем, представляя, как каждая свеча становится ярким путеводным светом, освещающим связь с вашими предками. Свечи должны стоять рядом друг с другом. Тлеющие травы должны находиться рядом со свечами в момент горения.

    Когда все зажгли, закройте глаза и сосредоточьтесь на дыхании. Визуализируйте свет, исходящий от свечей, который соединяет вас с родом. Представьте, как ваши предки окружают вас, поддерживают и направляют. Когда почувствуете необходимость и внутренний позыв, не открывая глаз поднесите ладони к горящей свече, чтобы почувствовать тепло.

    Позвольте теплу протечь по всему телу: от ладоней к голове, от головы к сердцу, от сердца к животу, от живота к ногам вплоть до ступней. Мысленно поддерживайте это тепло.

    Когда будете готовы, поблагодарите своих предков за поддержку и мудрость. Дайте свече прогореть до конца.

    Эта практика поможет вам установить более глубокую связь с вашими предками и получить поддержку в вашей жизни.

- id: practice_knots
  title: "Практика узлов намерения"
  order: 40
  active: true
  text: |
    В нашей традиции есть много практик, связанных с узлами и постановкой намерения. Сегодня поделимся одной из них, ее можно проводить как раз в новолуние, если ставите финансовое намерение, и в полнолуние для сокровенного желания.

    Итак, ритуал завязывания узлов — это древняя практика, которая используется для фокусировки намерений, энергетической защиты и привлечения желаемого.

    ЧТО НУЖНО ПОДГОТОВИТЬ:
    — Нитка или шнур (можно использовать красную или белую нитку, символизирующую защиту и чистоту).
    — Тихое место, где вас никто не побеспокоит.
    — Чистые намерения и сосредоточенность.

    ПОДГОТАВЛИВАЕМ ПРОСТРАНСТВО

    Найдите спокойное место, где вы сможете сосредоточиться и расслабиться. Создайте атмосферу, которая поможет вам сосредоточиться: зажгите свечу, ароматическую палочку или включите спокойную музыку.

    Сядьте удобно и закройте глаза. Сделайте несколько глубоких вдохов и выдохов, чтобы успокоить ум. Подумайте о своём намерении. Это может быть что-то, чего вы хотите достичь, защитить или освободиться от чего-то негативного.

    Возьмите нитку и начните завязывать узлы. На каждом узле произносите своё намерение вслух или про себя. Например:

    — Первый узел: «Я освобождаюсь от страха.»
    — Второй узел: «Я привлекаю любовь и гармонию.»
    — Третий узел: «Я защищён от негативных энергий.»
    — И так далее, в зависимости от количества узлов и ваших намерений.

    Не нужно собирать все в одну копилку. И деньги, и любовь, и успех. Посмотрите на один важный запрос комплексно. Что он вам принесет в итоге? Какое должно быть в результате состояние? Как вы изменитесь?

    Когда все узлы завязаны, поблагодарите Вселенную за поддержку. Дайте себе несколько минут, чтобы посидеть в тишине и почувствовать, как ваша энергия соединяется с созданными узлами.

    Носите завязанные узлы с собой или храните их в специальном месте. Каждый раз, когда вы будете видеть их, напоминайте себе о своих намерениях и силе, которую вы вложили в эту практику.

